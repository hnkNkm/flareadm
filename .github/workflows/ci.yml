name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check

      - name: Build
        run: nix develop -c go build ./...

      - name: Vet
        run: nix develop -c go vet ./...

      - name: Test
        run: nix develop -c go test ./...

      - name: Test (race)
        run: nix develop -c go test -race ./...

      - name: Lint
        run: nix develop -c golangci-lint run

      - name: Command reference is up to date
        run: nix develop -c bash -c 'go run ./tools/docgen | diff -u docs/commands.md -'

      - name: Vulnerability scan
        run: nix develop -c govulncheck ./...

      - name: Cross-compile (windows/amd64)
        run: nix develop -c env GOOS=windows GOARCH=amd64 go build ./...
