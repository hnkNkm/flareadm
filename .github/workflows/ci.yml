name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check

      - name: Build
        run: nix develop -c go build ./...

      - name: Vet
        run: nix develop -c go vet ./...

      - name: Test
        run: nix develop -c go test ./...

      - name: Lint
        run: nix develop -c golangci-lint run

      - name: Cross-compile (windows/amd64)
        run: nix develop -c env GOOS=windows GOARCH=amd64 go build ./...
